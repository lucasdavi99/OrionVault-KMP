<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(51, 65, 85, 0.5);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }
        .inner-glow-focus:focus-within {
            box-shadow: 0 0 0 2px #c0c1ff44, inset 0 0 8px #c0c1ff22;
        }
        @keyframes pulse-scan {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .pulse-animation {
            animation: pulse-scan 3s infinite ease-in-out;
        }
    </style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col overflow-hidden">
<!-- Atmosphere / Background Effect -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary/5 rounded-full blur-[150px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-margin-mobile">
<div class="w-full max-w-sm flex flex-col items-center">
<!-- Vault Logo -->
<div class="mb-xl transition-transform duration-700 hover:scale-105">
<img alt="OrionVault Logo" class="w-24 h-24 object-contain filter drop-shadow-[0_0_15px_rgba(192,193,255,0.3)]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBATI0KPe5svJ9vj8y5JggGLUX6ah95Ntdqu0-bB_6HCRdzQUy9Hj4AgLGU8vu7xgyIOqnbLTH2oXLvA1co1kmLOaFB_NC-dCTYM_foH4lHQBCyv74POKXDAcGjde7-iFqTxmcaLuQk4Su7tAQ5PoIKHjg_xlpLXoZt4EdIHxE18YoVYSmCcDm89P5agz-uquMjFWnK70ryi8kbR8uQRZOwPdSr8QNBrdYQXoKdcqkEWK6hhnEIHqMH"/>
</div>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md text-on-surface mb-lg tracking-tight">
                Vault Locked
            </h1>
<!-- Secure Input Section -->
<div class="w-full space-y-md">
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input autocomplete="current-password" class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-4 pl-12 pr-md text-on-surface placeholder:text-outline/60 font-code-md focus:outline-none focus:border-primary transition-all inner-glow-focus" placeholder="Master Password" type="password"/>
</div>
<!-- Error State -->
<div class="flex items-center space-x-xs px-xs">
<span class="material-symbols-outlined text-error text-[18px]">error</span>
<p class="text-error font-label-sm text-label-sm">Incorrect master password</p>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full mt-xl space-y-md">
<button class="w-full bg-primary py-4 rounded-lg text-on-primary font-headline-md text-[16px] hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-primary/20">
                    Unlock Vault
                </button>
<div class="flex items-center justify-center py-md">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="px-md font-label-sm text-outline text-[10px] uppercase tracking-widest">or biometric</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
</div>
<button class="w-full glass-panel py-4 rounded-lg flex items-center justify-center space-x-md text-on-surface font-body-lg hover:bg-surface-variant transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-secondary-fixed-dim pulse-animation" style="font-variation-settings: 'opsz' 32;">drafts</span>
<span class="font-label-sm text-label-sm">Unlock with Face ID</span>
</button>
</div>
<!-- Footer Link -->
<footer class="mt-xl text-center">
<a class="text-primary font-label-sm text-label-sm hover:underline underline-offset-4 opacity-80 hover:opacity-100 transition-opacity" href="#">
                    Forgot Secret Key?
                </a>
</footer>
</div>
</main>
<!-- Biometric Scanning UI (Optional Micro-interaction hidden by default) -->
<div class="fixed inset-0 z-50 flex items-center justify-center glass-panel opacity-0 pointer-events-none transition-opacity duration-500" id="biometric-overlay">
<div class="text-center">
<div class="relative w-32 h-32 mx-auto mb-lg">
<div class="absolute inset-0 border-2 border-secondary rounded-full animate-ping opacity-20"></div>
<span class="material-symbols-outlined text-secondary text-[80px]" style="font-variation-settings: 'FILL' 0;">drafts</span>
</div>
<p class="text-on-surface font-headline-md">Authenticating...</p>
</div>
</div>
<script>
        // Micro-interactions for demonstration
        const biometricBtn = document.querySelectorAll('button')[1];
        const overlay = document.getElementById('biometric-overlay');

        if (biometricBtn) {
            biometricBtn.addEventListener('click', () => {
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    overlay.classList.add('opacity-0', 'pointer-events-none');
                }, 2000);
            });
        }

        // Handle focus states for input
        const passwordInput = document.querySelector('input[type="password"]');
        passwordInput.addEventListener('focus', () => {
            // Remove error message on new input attempt if desired

        });
    </script>
