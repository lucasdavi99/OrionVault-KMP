<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

                        "surface-container-lowest": "#060e20",
                        "on-primary-fixed": "#07006c",

                        "primary-container": "#8083ff",
                        "secondary-container": "#00a572",
                        "inverse-surface": "#dae2fd",

                    "fontFamily": {

                },
            },
        }

<style>
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(51, 65, 85, 0.5);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }
        .input-vault {
            background: #060e20;
            border: 1px solid #464554;
            transition: all 0.2s ease-in-out;
        }
        .input-vault:focus {
            outline: none;
            border-color: #c0c1ff;
            box-shadow: 0 0 0 2px rgba(192, 193, 255, 0.2);
        }
        .strength-bar {
            height: 4px;
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        body {
            background-color: #0b1326;
            color: #dae2fd;
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased overflow-x-hidden">
<!-- Top Navigation Header (Transactional Context: Back/Save) -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface border-b border-outline-variant flex justify-between items-center px-margin-mobile h-16 z-40">
<button class="flex items-center space-x-2 text-on-surface-variant hover:text-primary transition-colors duration-200" onclick="window.history.back()">
<span class="material-symbols-outlined">close</span>
<span class="font-label-sm text-label-sm">Cancel</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Edit Item</h1>
<button class="bg-primary text-on-primary px-lg py-2 rounded-full font-label-sm text-label-sm hover:opacity-90 transition-all active:scale-95 shadow-lg shadow-primary/20">
            Save
        </button>
</header>
<main class="px-margin-mobile py-lg pb-32 max-w-md mx-auto">
<!-- Logo/Header Context Section -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 rounded-xl glass-panel flex items-center justify-center mb-md border-primary/20 border">
<img class="w-10 h-10" data-alt="A clean and minimalist digital icon for GitHub, designed for a high-security vault interface. The icon is rendered in a monochromatic silver and deep purple scheme, floating within a glassmorphic container with soft inner glows. The lighting is sophisticated and directional, emphasizing the 3D depth of the logo against a dark midnight blue background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCVBo649WKXrgeIxjUWEq2zTqunP16j8zRiQ2wg3pVtnPOlyg0FjwHH9P8S6-ezY4O1--NJGvc5GEkss_aCTzAuyaxXj90D_Gp_5N2UkYu6TJ7xSJ7Z2NlhUgAmQGI4eFgjtGee_ME7KoMfB-nsm8g0GcANEjEZWoqUBYg5vxJAuEV3qL0KqxtynwdrxSLy7C4IdmH1Nv_fE5YxDzuzNxDH7J1HWRwEphqD1yPDBYfy3j9p9oAaF8hW"/>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">GitHub</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant">Last edited 2 days ago</p>
</div>
<!-- Form Section -->
<form class="space-y-lg">
<!-- Name -->
<div class="space-y-base">
<label class="font-label-sm text-label-sm text-primary uppercase tracking-wider">Name</label>
<div class="relative">
<input class="input-vault w-full px-md py-sm rounded-lg font-body-md text-body-md text-on-surface" type="text" value="GitHub"/>
</div>
</div>
<!-- Username -->
<div class="space-y-base">
<label class="font-label-sm text-label-sm text-primary uppercase tracking-wider">Username</label>
<div class="relative">
<input class="input-vault w-full px-md py-sm rounded-lg font-body-md text-body-md text-on-surface" type="text" value="octocat"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant cursor-pointer hover:text-primary">person</span>
</div>
</div>
<!-- Password -->
<div class="space-y-base">
<label class="font-label-sm text-label-sm text-primary uppercase tracking-wider">Password</label>
<div class="flex space-x-2">
<div class="relative flex-grow">
<input class="input-vault w-full px-md py-sm rounded-lg font-code-md text-code-md text-on-surface pr-12" id="password-field" type="password" value="SuperSecretPassword123!"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
<button class="bg-secondary-container text-on-secondary-container px-md py-sm rounded-lg font-label-sm text-label-sm flex items-center space-x-1 hover:brightness-110 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[18px]">enhanced_encryption</span>
<span>Generate</span>
</button>
</div>
<!-- Password Strength -->
<div class="mt-2 space-y-1">
<div class="flex justify-between items-center">
<span class="font-label-sm text-label-sm text-secondary">Strong Security</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">92%</span>
</div>
<div class="w-full bg-surface-container-highest rounded-full h-1 overflow-hidden">
<div class="bg-secondary h-full w-[92%] shadow-[0_0_8px_rgba(78,222,163,0.5)]"></div>
</div>
</div>
</div>
<!-- URL -->
<div class="space-y-base">
<label class="font-label-sm text-label-sm text-primary uppercase tracking-wider">URL</label>
<div class="relative">
<input class="input-vault w-full px-md py-sm rounded-lg font-body-md text-body-md text-on-surface" type="url" value="https://github.com"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant cursor-pointer hover:text-primary">open_in_new</span>
</div>
</div>
<!-- Folder Selector -->
<div class="space-y-base">
<label class="font-label-sm text-label-sm text-primary uppercase tracking-wider">Folder</label>
<button class="input-vault w-full px-md py-sm rounded-lg font-body-md text-body-md text-on-surface flex justify-between items-center" type="button">
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-secondary">folder_open</span>
<span>Work &gt; Development</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</button>
</div>
<!-- Notes -->
<div class="space-y-base">
<label class="font-label-sm text-label-sm text-primary uppercase tracking-wider">Notes</label>
<textarea class="input-vault w-full px-md py-sm rounded-lg font-body-md text-body-md text-on-surface resize-none" placeholder="Add secure notes here..." rows="4">GitHub developer account. Used for personal projects and contribution to OrionVault Open Source components.</textarea>
</div>
<!-- Security Audit Status (Contextual Component) -->
<div class="glass-panel p-md rounded-xl border-secondary/20 bg-secondary/5 mt-xl">
<div class="flex items-start space-x-sm">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<div>
<h4 class="font-label-sm text-label-sm text-on-surface font-bold">Secure Environment</h4>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 leading-relaxed">This item is encrypted with AES-256 and synchronized across your authorized devices only.</p>
</div>
</div>
</div>
<!-- Danger Zone -->
<div class="pt-xl pb-10">
<button class="w-full flex items-center justify-center space-x-2 text-error hover:bg-error-container/10 py-md rounded-lg transition-colors duration-200" type="button">
<span class="material-symbols-outlined">delete</span>
<span class="font-label-sm text-label-sm">Delete Item Permanentely</span>
</button>
</div>
</form>
</main>
<!-- Bottom Navigation Shell (Suppressed as per rules for Task-Focused screen) -->
<!-- But we can add a persistent Biometric Scan Hint overlay at the bottom if needed -->
<div class="fixed bottom-margin-mobile left-1/2 -translate-x-1/2 flex flex-col items-center animate-pulse opacity-50 pointer-events-none" id="biometric-indicator">
<span class="material-symbols-outlined text-on-surface-variant text-[24px]">fingerprint</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">Encrypted Session Active</span>
</div>
<!-- Micro-interactions Script -->
<script>
        function togglePassword() {
            const pwd = document.getElementById('password-field');
            const eye = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                eye.innerText = 'visibility_off';
            } else {
                pwd.type = 'password';
                eye.innerText = 'visibility';
            }
        }

        // Simple Atmospheric Effect: Mouse/Touch tracking for the "Vault" feel
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            document.body.style.backgroundImage = `radial-gradient(circle at ${x * 100}% ${y * 100}%, rgba(30, 41, 59, 0.4) 0%, rgba(11, 19, 38, 1) 100%)`;
        });
    </script>
</body></html>
