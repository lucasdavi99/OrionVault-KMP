<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const primaryBtn = document.querySelector('button.bg-primary');
            if (primaryBtn) {
                primaryBtn.addEventListener('click', () => {
                    // Feedback effect
                    const originalScale = primaryBtn.style.transform;
                    primaryBtn.style.transform = 'scale(0.98)';
                    setTimeout(() => primaryBtn.style.transform = originalScale, 100);
                });
            }
        });
    </script>
